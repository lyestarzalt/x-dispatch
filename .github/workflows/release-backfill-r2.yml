name: Release Backfill R2

# Copies existing GitHub releases to R2. Tags listed in "current" also take
# over the channel pointer (and the Windows feed for stable).

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Space-separated tags to copy (e.g. v2.0.1 v2.1.0)
        required: true
        type: string
      current:
        description: Space-separated tags to make the channel's latest (e.g. v2.1.0 v2.2.0-rc.3)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill R2
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy releases
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAGS: ${{ inputs.tags }}
          CURRENT: ${{ inputs.current }}
        run: |
          set -euo pipefail
          declare -A done_tags=()
          for tag in $TAGS $CURRENT; do
            [ -n "${done_tags[$tag]:-}" ] && continue
            done_tags[$tag]=1
            mode=archive
            [[ " $CURRENT " == *" $tag "* ]] && mode=release

            dir="assets/$tag"
            rm -rf "$dir" && mkdir -p "$dir"
            gh release download "$tag" --dir "$dir" \
              --pattern '*.exe' --pattern '*.dmg' --pattern '*.AppImage' \
              --pattern '*.nupkg' --pattern 'RELEASES'
            gh release view "$tag" --json body --jq .body > "$dir.notes.md"
            channel=stable
            [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = "true" ] && channel=rc
            PUBLISHED_AT="$(gh release view "$tag" --json publishedAt --jq .publishedAt)" \
              bash scripts/publish-r2.sh "$mode" "$channel" "$tag" "$dir" "$dir.notes.md"
            rm -rf "$dir"
          done
