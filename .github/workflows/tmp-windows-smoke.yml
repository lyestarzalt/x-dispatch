name: TMP Windows Build Smoke Test

# Throwaway workflow: verifies that `npm run make` packages on the pinned
# Windows runner. Delete before merging the branch.

on:
  push:
    branches: [fix/ci-pin-windows-runner]

jobs:
  build:
    name: Build (windows)
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package app
        run: npm run make
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: List build output
        shell: bash
        run: find out/make -type f -name '*.exe' -print
