name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      legacy_github_assets:
        description: >-
          Also publish the release on GitHub with the Windows update feed only,
          so installs older than 2.2 (which only check GitHub) can update
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  compute-version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      base_sha: ${{ github.sha }}
    steps:
      # The branch rule on main only lets the X-Dispatch app push; the default token cannot.
      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.X_DISPATCH_APP_ID }}
          private-key: ${{ secrets.X_DISPATCH_APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Preflight push (fail before any build)
        run: git push --dry-run origin HEAD:main

      # The notes pilots read come from "## [Unreleased]" in CHANGELOG.md, never
      # from commit messages; stop before building when they have not been written.
      - name: Check release notes (fail before any build)
        run: bash scripts/release-notes.sh check CHANGELOG.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version (no git mutation)
        id: compute
        run: |
          NEW=$(npm version ${{ inputs.version }} --no-git-tag-version)
          echo "version=${NEW#v}" >> $GITHUB_OUTPUT
          echo "tag=$NEW" >> $GITHUB_OUTPUT
          # Discard the local edit — we only wanted the version string
          git checkout -- package.json package-lock.json

  build:
    name: Build (${{ matrix.name }})
    needs: compute-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: mac-apple-silicon
            arch: arm64
          - os: macos-15-intel
            name: mac-intel
            arch: x64
          - os: windows-2022
            name: windows
          - os: ubuntu-latest
            name: linux-x64
            sentry: true
          - os: ubuntu-24.04-arm
            name: linux-arm64
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.compute-version.outputs.base_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bake target version into package.json (no commit)
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Install platform dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Install platform dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install python-setuptools

      - name: Package app
        run: npm run make ${{ matrix.arch && format('-- --arch={0}', matrix.arch) || '' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Only upload source maps once — same maps for all platforms
          SENTRY_AUTH_TOKEN: ${{ matrix.sentry && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ matrix.sentry && secrets.SENTRY_ORG || '' }}
          SENTRY_PROJECT: ${{ matrix.sentry && secrets.SENTRY_PROJECT || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.AppImage
          retention-days: 1

  release:
    name: Tag and publish
    needs: [compute-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.X_DISPATCH_APP_ID }}
          private-key: ${{ secrets.X_DISPATCH_APP_PRIVATE_KEY }}

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanity check (main hasn't drifted)
        run: |
          CURRENT=$(git rev-parse HEAD)
          EXPECTED=${{ needs.compute-version.outputs.base_sha }}
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "::warning::main moved during build (expected $EXPECTED, got $CURRENT). Artifacts were built from $EXPECTED."
          fi

      - name: Bump version, commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.version }} -m "release: %s"
          git push --follow-tags

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Flatten artifacts into release folder
        id: assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \) -exec cp {} release-assets/ \;
          echo "Collected assets:"
          ls -la release-assets/

      # Commit list for the collapsed "All changes" section on GitHub only.
      - name: List commits
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ needs.compute-version.outputs.tag }} --strip header --latest
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: commits.md

      # The Unreleased notes in CHANGELOG.md go to Discord, the update notice and
      # the website (the commit list stays on the GitHub release), then move
      # into this version's section with a fresh Unreleased above it.
      - name: Write release notes
        id: notes
        env:
          TAG: ${{ needs.compute-version.outputs.tag }}
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh print CHANGELOG.md > user-notes.md
          {
            echo "user<<NOTES_EOF"
            cat user-notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          bash scripts/release-notes.sh release "$VERSION" "$(date -u +%Y-%m-%d)" CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: release notes for $TAG"
          git push

          # Headings in the commit list are demoted to #### so the website's
          # section parser only reads the notes above it.
          {
            cat user-notes.md
            echo ""
            echo "<details>"
            echo "<summary>All changes</summary>"
            echo ""
            tail -n +2 commits.md | sed 's/^### /#### /'
            echo ""
            echo "</details>"
          } > release-notes.md

          cat >> release-notes.md << 'EOF'

          ---

          > :apple: **macOS (Sequoia/Tahoe):** The app is unsigned. Go to **System Settings > Privacy & Security** and click **"Open Anyway"**, or run: `xattr -rd com.apple.quarantine /Applications/X-Dispatch.app`

          > :window: **Windows:** If X-Plane doesn't launch from the app, try running X-Dispatch as administrator.
          EOF

      # Installers ship from R2 only. The draft is never public and holds the
      # notes that release-sync-notes.yml copies to R2 after editing.
      - name: Create draft GitHub release (notes only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          # Delete any leftover draft/release from a failed previous run
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file release-notes.md

      - name: Publish release to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/publish-r2.sh release stable "${{ needs.compute-version.outputs.tag }}" release-assets release-notes.md

      - name: Verify public downloads
        run: bash scripts/check-r2-public.sh

      # Marks the release on every PostHog chart. Never fails a release: skipped
      # without the key, and a PostHog outage only loses the marker.
      - name: Mark release in PostHog
        continue-on-error: true
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          if [ -z "$POSTHOG_PERSONAL_API_KEY" ]; then
            echo "POSTHOG_PERSONAL_API_KEY not set, skipping"
            exit 0
          fi
          jq -n --arg tag "$TAG" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{content: $tag, date_marker: $at, scope: "project"}' |
            curl -fsS --max-time 15 -X POST \
              "https://eu.posthog.com/api/projects/287775/annotations/" \
              -H "Authorization: Bearer $POSTHOG_PERSONAL_API_KEY" \
              -H "Content-Type: application/json" \
              --data @- -o /dev/null

      # Bridge for installs older than 2.2. Windows updates through
      # update.electronjs.org and macOS/Linux read releases/latest, both of which
      # only see published GitHub releases. update.electronjs.org only treats a
      # release as having a Windows build when it holds a .exe, so the Windows
      # installer goes up with the Squirrel files; the macOS/Linux installers stay
      # website-only (their update notice opens x-dispatch.app/download).
      - name: Publish GitHub release for legacy updaters
        if: inputs.legacy_github_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(release-assets/*.nupkg)
          installers=(release-assets/*-windows-x64.exe)
          if [ ! -f release-assets/RELEASES ] || [ ${#packages[@]} -eq 0 ] || [ ${#installers[@]} -eq 0 ]; then
            echo "::error title=Missing Windows files::RELEASES, .nupkg or the Windows .exe not found; legacy Windows installs could not update."
            exit 1
          fi
          # Upload before publishing so the feed never points at a release without files.
          gh release upload "$TAG" release-assets/RELEASES "${packages[@]}" "${installers[@]}" --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "- :white_check_mark: Published \`$TAG\` on GitHub with the Windows update files" >> "$GITHUB_STEP_SUMMARY"

      - name: Mint website sync token
        id: site-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.X_DISPATCH_APP_ID }}
          private-key: ${{ secrets.X_DISPATCH_APP_PRIVATE_KEY }}
          owner: lyestarzalt
          repositories: x-dispatch.app

      - name: Sync website stable catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Website sync skipped::No token for x-dispatch.app. The website still points at the previous release."
            echo "- :warning: Website sync **skipped** for \`$TAG\` (no token)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh workflow run sync-release.yml \
            --repo lyestarzalt/x-dispatch.app \
            -f source_repo="${{ github.repository }}" \
            -f channel="stable" \
            -f source="r2" \
            -f tag="$TAG"; then
            echo "::warning title=Website sync failed::Dispatch of sync-release.yml failed. The website still points at the previous release."
            echo "- :warning: Website sync **failed** for \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- :white_check_mark: Website sync dispatched for \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Send Discord notification
        continue-on-error: true
        env:
          NOTES: ${{ steps.notes.outputs.user }}
          TAG: ${{ needs.compute-version.outputs.tag }}
          REPO: ${{ github.repository }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "X-Dispatch ${{ needs.compute-version.outputs.tag }} Released"
          embed-url: "https://x-dispatch.app/changelog/"
          embed-description: |
            ${{ env.NOTES }}

            **Downloads:**
            - [:apple: macOS (Apple Silicon)](https://dl.x-dispatch.app/releases/${{ needs.compute-version.outputs.tag }}/X-Dispatch-${{ needs.compute-version.outputs.version }}-mac-apple-silicon.dmg)
            - [:apple: macOS (Intel)](https://dl.x-dispatch.app/releases/${{ needs.compute-version.outputs.tag }}/X-Dispatch-${{ needs.compute-version.outputs.version }}-mac-intel.dmg)
            - [:window: Windows](https://dl.x-dispatch.app/releases/${{ needs.compute-version.outputs.tag }}/X-Dispatch-${{ needs.compute-version.outputs.version }}-windows-x64.exe)
            - [:penguin: Linux x64](https://dl.x-dispatch.app/releases/${{ needs.compute-version.outputs.tag }}/X-Dispatch-${{ needs.compute-version.outputs.version }}-linux-x64.AppImage)
            - [:penguin: Linux ARM64](https://dl.x-dispatch.app/releases/${{ needs.compute-version.outputs.tag }}/X-Dispatch-${{ needs.compute-version.outputs.version }}-linux-arm64.AppImage)
          embed-color: 3447003
