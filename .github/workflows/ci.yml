name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # node_modules itself, keyed on the lockfile: a hit skips the install entirely.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # The slow checks share nothing, so they run at once; the step fails if any of them does.
      - name: Typecheck, lint, format, tests
        run: |
          npm run typecheck & p1=$!
          npm run lint & p2=$!
          npm run format:check & p3=$!
          npm run test:run & p4=$!
          status=0
          for pid in "$p1" "$p2" "$p3" "$p4"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Drizzle migrations and third-party notices
        run: npm run check:migrations && npm run check:notices
