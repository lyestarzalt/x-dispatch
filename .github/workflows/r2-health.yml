name: Downloads Health

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: Extra tags to verify (space-separated)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Check dl.x-dispatch.app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check public downloads
        env:
          TAGS: ${{ inputs.tags }}
        run: bash scripts/check-r2-public.sh $TAGS
